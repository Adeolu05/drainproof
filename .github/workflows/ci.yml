name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm -r typecheck
      - run: pnpm test

  drainproof:
    name: Drainproof security suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate example policy and scenarios
        run: |
          pnpm drainproof policy validate --config examples/payment-policy/drainproof.yaml
          pnpm drainproof scenarios validate --config examples/payment-policy/drainproof.yaml
      - name: Payment policy suite
        run: pnpm drainproof test --config examples/payment-policy/drainproof.yaml --no-color --json reports/payment-policy.json --markdown reports/payment-policy.md --github-summary
      - name: NEAR testnet policy suite (offline, no transactions)
        run: pnpm drainproof test --config examples/near-testnet/drainproof.yaml --no-color --json reports/near-testnet.json --markdown reports/near-testnet.md --github-summary
      - name: Guard built on @drainproof/core
        run: pnpm drainproof test --config examples/basic-agent/drainproof.fixed.yaml --no-color --no-save
      - name: Recipient-check pack (look-alike and non-allowlisted accounts)
        run: pnpm drainproof test --config examples/recipient-checks/drainproof.yaml --no-color --json reports/recipient-checks.json --markdown reports/recipient-checks.md --github-summary
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drainproof-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  regression-gate:
    name: An unsafe policy change must fail the suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Allowlist an attacker and expect exit code 1
        run: |
          sed -i 's/    - data-provider-example/    - data-provider-example\n    - attacker-wallet/' examples/payment-policy/policy.yaml
          set +e
          pnpm drainproof test --config examples/payment-policy/drainproof.yaml --no-color --no-save
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          echo "Unsafe policy change was detected (exit code 1), as required."
      - name: The naive guard example must fail
        run: |
          set +e
          pnpm drainproof test --config examples/basic-agent/drainproof.yaml --no-color --no-save --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

  action:
    name: The Drainproof GitHub Action (uses ./)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Action, policy input: the example policy must pass"
        id: safe
        uses: ./
        with:
          policy: examples/payment-policy/policy.yaml
          report-dir: reports/action-safe
      - name: "Action, config input: the NEAR suite must pass"
        id: near
        uses: ./
        with:
          config: examples/near-testnet/drainproof.yaml
          report-dir: reports/action-near
          node-version: ""
      - name: Make the policy unsafe (allowlist attacker-wallet)
        run: sed -i 's/    - data-provider-example/    - data-provider-example\n    - attacker-wallet/' examples/payment-policy/policy.yaml
      - name: "Action, policy input: the unsafe policy must fail"
        id: unsafe
        continue-on-error: true
        uses: ./
        with:
          policy: examples/payment-policy/policy.yaml
          report-dir: reports/action-unsafe
          node-version: ""
      - name: Check the action's outcomes and outputs
        env:
          SAFE_OUTCOME: ${{ steps.safe.outcome }}
          SAFE_CODE: ${{ steps.safe.outputs.exit-code }}
          SAFE_STATUS: ${{ steps.safe.outputs.status }}
          NEAR_CODE: ${{ steps.near.outputs.exit-code }}
          UNSAFE_OUTCOME: ${{ steps.unsafe.outcome }}
          UNSAFE_CODE: ${{ steps.unsafe.outputs.exit-code }}
          UNSAFE_STATUS: ${{ steps.unsafe.outputs.status }}
          UNSAFE_MD: ${{ steps.unsafe.outputs.report-markdown }}
        run: |
          set -eu
          echo "safe: $SAFE_OUTCOME $SAFE_CODE $SAFE_STATUS; near: $NEAR_CODE; unsafe: $UNSAFE_OUTCOME $UNSAFE_CODE $UNSAFE_STATUS"
          test "$SAFE_OUTCOME" = success && test "$SAFE_CODE" = 0 && test "$SAFE_STATUS" = PASSED
          test "$NEAR_CODE" = 0
          test "$UNSAFE_OUTCOME" = failure && test "$UNSAFE_CODE" = 1 && test "$UNSAFE_STATUS" = FAILED
          grep -F "[CRITICAL] Instruction injection cannot override deterministic policy rules" "$UNSAFE_MD"
          git checkout -- examples/payment-policy/policy.yaml
          test -z "$(git status --porcelain --untracked-files=all -- examples)"
          test -z "$(ls -A .drainproof-action* 2>/dev/null)"
          echo "The action passed the safe policy and failed the unsafe one, as required."
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm --filter @drainproof/web typecheck

  vault:
    name: Vault contract (unit tests, sandbox tests, scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # cargo-near release binary, checked against the SHA-256 published with the release.
      CARGO_NEAR_VERSION: 0.22.0
      CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Rust toolchain from contracts/vault/rust-toolchain.toml
        working-directory: contracts/vault
        run: |
          rustup toolchain install
          rustc --version
      - name: Install cargo-near
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-near.tar.gz" "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  $RUNNER_TEMP/cargo-near.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-near.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - name: Contract format, lints and unit tests
        working-directory: contracts/vault
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the contract wasm
        run: pnpm build:vault
      - name: Sandbox integration tests (local NEAR node, no testnet)
        run: pnpm test:vault
      - name: Built-in scenarios against the vault (local sandbox)
        run: pnpm drainproof test --config examples/near-vault/drainproof.yaml --no-color --json reports/near-vault.json --markdown reports/near-vault.md --github-summary
      - name: Recipient-check pack against the vault (local sandbox)
        run: pnpm drainproof test --config examples/recipient-checks/drainproof.vault.yaml --no-color --json reports/recipient-checks-vault.json --markdown reports/recipient-checks-vault.md --github-summary
      - name: Vault demo (local sandbox)
        run: pnpm --filter @drainproof/example-near-vault demo
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
